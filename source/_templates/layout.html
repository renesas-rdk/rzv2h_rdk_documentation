{% extends "!layout.html" %}

{% block sidebartitle %}
  {{ super() }}
  <div class="version-switcher" id="version-switcher-container" hidden>
    <select
      id="version-switcher"
      class="version-switcher__select"
      aria-label="Select documentation version"
      onchange="if (this.value) window.location.href = this.value;"
    ></select>
  </div>
{% endblock %}
